# Temporary diagnostics run (throwaway ewo/diag-* branches only; never merged).
name: EWO Verification
on:
  push:
    branches: ['ewo/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Deno and smoke
        shell: bash
        run: |
          set +e
          enc() { python3 -c 'import sys; d=sys.stdin.read()[-60000:]; print(d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          for f in axcelerate-inbound-sync send-email on-assessment-complete process-email-queue send-admin-otp; do
            DENO_NO_PACKAGE_JSON=1 deno check --node-modules-dir=none supabase/functions/$f/index.ts > d.txt 2>&1; RC=$?
            { echo "exit=$RC"; sed 's/\x1b\[[0-9;]*m//g' d.txt | grep -E 'TS[0-9]+ \[ERROR\]|^ +at file' | sed -E 's#.*/supabase/functions/##'; } > d.sum
            echo "::notice title=DENO $f::$(enc < d.sum)"
          done
          npx vitest run src/tests/issue040_rto_workspace_access.test.ts > v40.txt 2>&1; V40=$?
          sed -i 's/\x1b\[[0-9;]*m//g' v40.txt
          { echo "exit=$V40"; grep -E '^ *(Test Files|Tests) |FAIL|AssertionError' v40.txt | head -n 30; } > v40.sum
          echo "::notice title=ISSUE040_TESTS::$(enc < v40.sum)"
          true
