# Temporary diagnostics run (throwaway ewo/diag-* branches only; never merged).
# Results are emitted as annotations so they can be read through the API.
name: EWO Verification
on:
  push:
    branches: ['ewo/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Gates
        shell: bash
        run: |
          set +e
          enc() { python3 -c 'import sys,urllib.parse; d=sys.stdin.read()[-60000:]; print(d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          npx tsc --noEmit > tsc.txt 2>&1; T=$?
          { echo "exit=$T errors=$(grep -c 'error TS' tsc.txt)"; grep 'error TS' tsc.txt | sed -E 's/\(.*//' | sort | uniq -c | sort -rn; } > tsc.sum
          echo "::notice title=TYPECHECK::$(enc < tsc.sum)"
          npx eslint src/ --max-warnings 0 > eslint.txt 2>&1; E=$?
          { echo "exit=$E"; tail -n 60 eslint.txt; } > eslint.sum
          echo "::notice title=LINT::$(enc < eslint.sum)"
          npx vite build > build.txt 2>&1; B=$?
          { echo "exit=$B"; tail -n 12 build.txt; } > build.sum
          echo "::notice title=BUILD::$(enc < build.sum)"
          npx vitest run > vitest.txt 2>&1; V=$?
          sed -i 's/\x1b\[[0-9;]*m//g' vitest.txt
          { echo "exit=$V"; grep -E '^ *(Test Files|Tests) ' vitest.txt; echo "failed files:"; grep -E '^ *FAIL ' vitest.txt | sed -E 's/^ *FAIL +//; s/ .*//' | sort -u; } > vitest.sum
          echo "::notice title=UNIT_TESTS::$(enc < vitest.sum)"
          npx vitest run src/tests/issue040_rto_workspace_access.test.ts > v40.txt 2>&1; V40=$?
          sed -i 's/\x1b\[[0-9;]*m//g' v40.txt
          { echo "exit=$V40"; grep -E '^ *(Test Files|Tests) |✗|×|FAIL|AssertionError' v40.txt | head -n 40; } > v40.sum
          echo "::notice title=ISSUE040_TESTS::$(enc < v40.sum)"
          true
