# Temporary rehearsal of the WP Assist staging backup script against a SYNTHETIC local Supabase DB.
# Throwaway ewo/diag-* branch; never merged. No hosted project contacted.
name: EWO Backup Script Rehearsal
on:
  push:
    branches: ['ewo/**']
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }
      - name: Start synthetic Supabase DB and seed fake data
        run: |
          mkdir -p /tmp/wd && cd /tmp/wd && (supabase init --force >/dev/null 2>&1 || supabase init) && supabase db start
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -q -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto with schema extensions;
          create table public.licences (id uuid primary key default gen_random_uuid(), label text);
          create table public.installations (id uuid primary key default gen_random_uuid(), licence_id uuid references public.licences(id), host text);
          alter table public.licences enable row level security;
          create policy p on public.licences for select to authenticated using (true);
          grant select on public.licences to service_role;
          insert into public.licences(label) select 'fake-'||g from generate_series(1,5) g;
          insert into public.installations(licence_id, host) select id, 'example.test' from public.licences;
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, raw_app_meta_data, raw_user_meta_data, created_at, updated_at)
          values (gen_random_uuid(), '00000000-0000-0000-0000-000000000000','authenticated','authenticated','fake@example.test','', '{}','{}', now(), now());
          SQL
          ss -ltnp | grep 54322 || true
      - name: Run the backup script with macOS-only commands stubbed
        shell: bash
        run: |
          set +e
          sudo mkdir -p /Volumes && sudo chmod 777 /Volumes
          cp wpa-staging-backup.sh /tmp/s.sh
          sed -i 's/sslmode=require/sslmode=disable/g' /tmp/s.sh
          hdiutil() { case "$1" in create) touch "${@: -1}";; attach) n=$(basename "$2" .dmg); mkdir -p "/Volumes/WPA-Staging-Backup-${n##*-}";; detach) cp -r "$2" /tmp/evidence 2>/dev/null; rm -rf "$2";; esac; }
          stat() { command stat -c%s "${@: -1}"; }
          export -f hdiutil stat
          URL='postgresql://postgres:[YOUR-PASSWORD]@172.17.0.1:54322/postgres?application_name=postgres.bybccpuosrvgwujapasm'
          printf '%s\n%s\n' "$URL" 'postgres' | bash /tmp/s.sh > /tmp/out.txt 2>&1; rc=$?
          echo "rc=$rc"; cat /tmp/out.txt | tail -40
          echo "::notice title=SCRIPT_RC::rc=$rc"
          echo "::notice title=SUMMARY::$(sed -n '/SUMMARY/,$p' /tmp/out.txt | tr '\n' '~' | sed 's/~/%0A/g' | cut -c1-3000)"
          echo "::notice title=TAIL::$(tail -25 /tmp/out.txt | tr '\n' '~' | sed 's/~/%0A/g' | cut -c1-3000)"
          echo "::notice title=EVIDENCE::$(ls /tmp/evidence 2>&1 | tr '\n' ' ') restore_errors=[$(head -c 1500 /tmp/evidence/restore-errors.log 2>/dev/null | tr '\n' '~' | sed 's/~/%0A/g')] dumplog=[$(cat /tmp/evidence/pg_dump-full.log 2>/dev/null | head -c 800 | tr '\n' ' ')] manifest=[$(cat /tmp/evidence/MANIFEST.txt 2>/dev/null | tr '\n' '~' | sed 's/~/%0A/g')]"
